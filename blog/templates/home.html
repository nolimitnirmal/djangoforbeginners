{% extends "base.html" %}

{% block content %}
  {% for post in posts %}
    <article>
      <h2><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
      <p>{{ post.body }}</p>
      <p>By {{ post.author }}</p>
    </article>
  {% empty %}
    <p>No blog posts have been published yet.</p>
  {% endfor %}
{% endblock content %}
